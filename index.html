<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韓國 7 天 6 夜行程規劃</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh;}
  a{color:inherit;text-decoration:none;}

  /* header */
  .header{background:#fff;border-bottom:1px solid #e8e6e0;padding:18px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .header-title{font-size:18px;font-weight:600;flex:1;}
  .header-meta{font-size:13px;color:#888;display:flex;gap:16px;flex-wrap:wrap;}
  .header-meta span{display:flex;align-items:center;gap:4px;}

  /* layout */
  .main{max-width:900px;margin:0 auto;padding:20px 16px 60px;}

  /* info bar */
  .info-bar{background:#EEEDFE;border-radius:10px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:10px;font-size:14px;color:#3C3489;}
  .info-bar i{font-size:18px;flex-shrink:0;}

  /* legend */
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .leg-item{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:20px;}
  .leg-shop{background:#EEEDFE;color:#3C3489;}
  .leg-food{background:#FAEEDA;color:#633806;}
  .leg-play{background:#E1F5EE;color:#085041;}
  .leg-sight{background:#FAECE7;color:#712B13;}

  /* day card */
  .day-card{background:#fff;border:1px solid #e8e6e0;border-radius:12px;margin-bottom:12px;overflow:hidden;transition:box-shadow .15s;}
  .day-card.dragging{opacity:.5;}
  .day-card.drag-over{border:2px dashed #7F77DD;}

  .day-header{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none;}
  .day-header:hover{background:#fafaf8;}
  .drag-handle{color:#ccc;cursor:grab;font-size:18px;flex-shrink:0;}
  .drag-handle:active{cursor:grabbing;}
  .day-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0;}
  .day-meta{flex:1;min-width:0;}
  .day-title{font-size:15px;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .day-sub{font-size:12px;color:#888;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .day-chevron{font-size:16px;color:#bbb;transition:transform .2s;flex-shrink:0;}
  .day-chevron.open{transform:rotate(180deg);}

  /* day body */
  .day-body{display:none;padding:0 16px 16px;}
  .day-body.open{display:block;}

  .sec-label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#aaa;margin:14px 0 8px;}
  .spots{display:flex;flex-wrap:wrap;gap:6px;}

  /* spot chip */
  .spot{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 11px;border-radius:20px;cursor:pointer;transition:opacity .15s;border:1.5px solid transparent;user-select:none;}
  .spot.done{opacity:.35;text-decoration:line-through;}
  .spot i{font-size:14px;}
  .spot-shop{background:#EEEDFE;color:#3C3489;border-color:#CECBF6;}
  .spot-food{background:#FAEEDA;color:#633806;border-color:#FAC775;}
  .spot-play{background:#E1F5EE;color:#085041;border-color:#9FE1CB;}
  .spot-sight{background:#FAECE7;color:#712B13;border-color:#F5C4B3;}

  /* note */
  .note-row{margin-top:14px;display:flex;gap:8px;align-items:flex-start;}
  .note-row i{font-size:15px;color:#aaa;margin-top:9px;flex-shrink:0;}
  .note-input{flex:1;border:1px solid #e8e6e0;border-radius:8px;padding:8px 10px;font-size:13px;color:#1a1a1a;resize:none;font-family:inherit;background:#fafaf8;line-height:1.5;min-height:36px;}
  .note-input:focus{outline:none;border-color:#7F77DD;background:#fff;}
  .note-input::placeholder{color:#bbb;}

  /* tip */
  .tip-box{margin-top:12px;font-size:12px;color:#888;background:#fafaf8;border-radius:8px;padding:9px 12px;display:flex;gap:7px;align-items:flex-start;}
  .tip-box i{font-size:14px;flex-shrink:0;margin-top:1px;}

  /* warn */
  .warn-box{margin-top:10px;font-size:12px;color:#791F1F;background:#FCEBEB;border-radius:8px;padding:9px 12px;display:flex;gap:7px;align-items:flex-start;}
  .warn-box i{font-size:14px;flex-shrink:0;margin-top:1px;}

  /* spot action buttons */
  .spot-wrap{position:relative;display:inline-flex;align-items:center;gap:2px;}
  .spot-actions{display:none;align-items:center;gap:1px;}
  .spot-wrap:hover .spot-actions{display:inline-flex;}
  .spot-act-btn{background:none;border:none;cursor:pointer;padding:3px 4px;border-radius:4px;color:#bbb;font-size:13px;line-height:1;display:flex;align-items:center;}
  .spot-act-btn:hover{background:#f0eeee;color:#555;}
  .spot-act-btn.del:hover{background:#FCEBEB;color:#791F1F;}
  @media(hover:none){.spot-actions{display:inline-flex;}}

  /* add-spot */
  .add-spot-row{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .add-input{border:1px solid #e8e6e0;border-radius:8px;padding:6px 10px;font-size:13px;color:#1a1a1a;background:#fafaf8;font-family:inherit;width:160px;}
  .add-input:focus{outline:none;border-color:#7F77DD;background:#fff;}
  .cat-sel{border:1px solid #e8e6e0;border-radius:8px;padding:6px 8px;font-size:13px;background:#fafaf8;color:#555;font-family:inherit;}
  .cat-sel:focus{outline:none;border-color:#7F77DD;}
  .add-btn{border:1px solid #e8e6e0;border-radius:8px;padding:6px 12px;font-size:13px;background:#fff;cursor:pointer;color:#555;display:flex;align-items:center;gap:4px;}
  .add-btn:hover{background:#EEEDFE;color:#3C3489;border-color:#AFA9EC;}

  /* toolbar */
  .toolbar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tool-btn{border:1px solid #e8e6e0;border-radius:8px;padding:7px 14px;font-size:13px;background:#fff;cursor:pointer;color:#555;display:flex;align-items:center;gap:6px;}
  .tool-btn:hover{background:#f5f4f0;}
  .tool-btn.primary{background:#534AB7;color:#fff;border-color:#534AB7;}
  .tool-btn.primary:hover{background:#3C3489;}

  /* progress */
  .progress-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .progress-bar{flex:1;height:6px;background:#e8e6e0;border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:#534AB7;border-radius:3px;transition:width .3s;}
  .progress-label{font-size:12px;color:#888;white-space:nowrap;}

  /* modal */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;align-items:center;justify-content:center;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:14px;padding:24px;max-width:440px;width:90%;max-height:80vh;overflow-y:auto;}
  .modal h3{font-size:16px;font-weight:600;margin-bottom:4px;}
  .modal p{font-size:13px;color:#888;margin-bottom:16px;}
  .modal textarea{width:100%;border:1px solid #e8e6e0;border-radius:8px;padding:10px;font-size:13px;font-family:inherit;resize:vertical;min-height:120px;color:#1a1a1a;}
  .modal textarea:focus{outline:none;border-color:#7F77DD;}
  .modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
  .modal-actions button{border:1px solid #e8e6e0;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;background:#fff;color:#555;}
  .modal-actions .ok-btn{background:#534AB7;color:#fff;border-color:#534AB7;}
  .modal-actions .ok-btn:hover{background:#3C3489;}

  /* copy toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:200;}
  .toast.show{opacity:1;}

  @media(max-width:600px){
    .day-title{font-size:14px;}
    .day-sub{font-size:11px;}
    .header{padding:12px 14px;}
    .header-title{font-size:16px;}
    .header-meta{font-size:12px;gap:10px;}
    .main{padding:14px 12px 60px;}
    .toolbar{gap:6px;}
    .tool-btn{padding:6px 10px;font-size:12px;}
    .spot{font-size:12px;padding:4px 9px;}
    .add-input{width:130px;font-size:12px;}
    .add-btn{font-size:12px;padding:5px 10px;}
    .info-bar{font-size:13px;}
    .modal{padding:18px;}
    .modal textarea{font-size:14px;}
    .modal-actions button{padding:10px 16px;font-size:14px;}
  }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="header">
  <i class="ti ti-plane" style="font-size:22px;color:#534AB7;" aria-hidden="true"></i>
  <div class="header-title">韓國 7 天 6 夜行程</div>
  <div class="header-meta">
    <span><i class="ti ti-home-2" aria-hidden="true"></i> ITDA・弘大</span>
    <span><i class="ti ti-clock" aria-hidden="true"></i> D1 凌晨5:00 仁川落地</span>
    <span id="sync-status" style="transition:color .3s;color:#bbb;"><i class="ti ti-cloud" aria-hidden="true"></i> 連線中…</span>
  </div>
</div>

<div class="main">
  <div class="info-bar">
    <i class="ti ti-info-circle" aria-hidden="true"></i>
    <span>點擊景點可標記已完成・可新增備注・拖曳卡片調整天數順序</span>
  </div>

  <div class="legend">
    <span class="leg-item leg-shop"><i class="ti ti-shopping-bag"></i>逛街</span>
    <span class="leg-item leg-food"><i class="ti ti-bowl-chopsticks"></i>吃的</span>
    <span class="leg-item leg-play"><i class="ti ti-confetti"></i>玩的</span>
    <span class="leg-item leg-sight"><i class="ti ti-building-arch"></i>景點</span>
  </div>

  <div class="progress-row">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-label" id="progress-label">0 / 0 個景點</div>
  </div>

  <div class="toolbar">
    <button class="tool-btn" onclick="expandAll()"><i class="ti ti-chevrons-down"></i> 展開全部</button>
    <button class="tool-btn" onclick="collapseAll()"><i class="ti ti-chevrons-up"></i> 收合全部</button>
    <button class="tool-btn" onclick="resetDone()"><i class="ti ti-refresh"></i> 重置勾選</button>
    <button class="tool-btn primary" onclick="copyText()"><i class="ti ti-copy"></i> 複製純文字版</button>
  </div>

  <div id="days-container"></div>
</div>

<!-- modal -->
<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal">
    <h3 id="modal-title">編輯行程標題</h3>
    <p id="modal-desc">修改這一天的主題或副標題</p>
    <textarea id="modal-input"></textarea>
    <div class="modal-actions">
      <button onclick="closeModalDirect()">取消</button>
      <button class="ok-btn" onclick="saveModal()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CLIENT_ID = Date.now().toString(36) + Math.random().toString(36).slice(2);
let pendingRemoteUpdate = false;
let noteSaveTimer = null;
let fbTripRef = null;

const DAYS_DATA = [
  {
    id:'d1', numColor:'#791F1F', numBg:'#FCEBEB',
    title:'抵達日・弘大放空',
    sub:'凌晨5:00落地 → AREX → 弘大咖啡廳補眠 → 望遠市場 → 入住',
    warn:'凌晨5點抵達，最早下午3點才能入住。行李可先寄放ITDA或弘大站置物櫃。',
    tip:'這天唯一的任務是撐到入住。不要安排任何重點景點，找間有沙發的咖啡廳坐著發呆就好。',
    note:'',
    sections:[
      {label:'隨意走走',type:'shop',icon:'ti-shopping-bag',spots:['弘大街邊','望遠市場（午餐）']},
      {label:'等待入住',type:'play',icon:'ti-confetti',spots:['漢江公園（散步）']},
    ]
  },
  {
    id:'d2', numColor:'#534AB7', numBg:'#EEEDFE',
    title:'弘大・聖水洞・漢江',
    sub:'弘大逛街 → 倫敦貝果博物館 → 聖水洞 → 漢江公園傍晚野餐',
    warn:'',
    tip:'今天輕鬆為主，讓身體從頭一天的奔波回血。聖水洞下午去最舒服，漢江傍晚買便利商店野餐收尾。',
    note:'',
    sections:[
      {label:'逛街',type:'shop',icon:'ti-shopping-bag',spots:['弘大']},
      {label:'咖啡廳/吃的',type:'food',icon:'ti-bowl-chopsticks',spots:['倫敦貝果博物館','聖水洞咖啡廳街']},
      {label:'傍晚',type:'sight',icon:'ti-building-arch',spots:['漢江公園（野餐）']},
    ]
  },
  {
    id:'d3', numColor:'#0F6E56', numBg:'#E1F5EE',
    title:'古宮・北村・鐘路夜食',
    sub:'景福宮 → 北村韓屋村 → 三清洞 → 廣藏市場 → 布帳馬車',
    warn:'',
    tip:'景福宮建議9點開門就去。北村→三清洞→廣藏市場步行可串連，晚上鐘路三街布帳馬車收尾，整天都在同一區不趕。',
    note:'',
    sections:[
      {label:'古蹟/景點',type:'sight',icon:'ti-building-arch',spots:['景福宮','北村韓屋村','三清洞']},
      {label:'吃的',type:'food',icon:'ti-bowl-chopsticks',spots:['廣藏市場（晚餐）','鐘路三街布帳馬車（夜宵）']},
    ]
  },
  {
    id:'d4', numColor:'#185FA5', numBg:'#E6F1FB',
    title:'南怡島・春川',
    sub:'ITX春川線 → 南怡島 → 春川炒雞 → 返回弘大',
    warn:'',
    tip:'南怡島和春川炒雞方向一致，搭ITX一路順下去即可。不塞江村鐵道，整天節奏輕鬆。下午3點前上島、5點前吃完炒雞，傍晚回弘大不趕。',
    note:'',
    sections:[
      {label:'景點',type:'sight',icon:'ti-building-arch',spots:['南怡島']},
      {label:'吃的',type:'food',icon:'ti-bowl-chopsticks',spots:['春川炒雞']},
    ]
  },
  {
    id:'d5', numColor:'#854F0B', numBg:'#FAEEDA',
    title:'江村鐵道・仁川一日遊',
    sub:'江村鐵道自行車（上午）→ 仁川中華街・童話村（下午）',
    warn:'江村鐵道和仁川方向相反，這天分兩段：早上江村、下午搭車去仁川。時間稍緊，也可把仁川改成獨立一天。',
    tip:'江村鐵道建議一早出發，玩完搭車去仁川約1.5小時。或者把仁川移到其他輕鬆的天，這天只玩江村就好。',
    note:'',
    sections:[
      {label:'上午',type:'play',icon:'ti-confetti',spots:['江村鐵道自行車']},
      {label:'下午',type:'sight',icon:'ti-building-arch',spots:['仁川中華街','松月洞童話村','月尾島']},
    ]
  },
  {
    id:'d6', numColor:'#3B6D11', numBg:'#EAF3DE',
    title:'愛寶樂園・南山夜景',
    sub:'愛寶樂園（全天）→ 馬鈴薯排骨湯晚餐 → 南山首爾塔夜景',
    warn:'',
    tip:'愛寶樂園旺季建議提前購票。傍晚6-7點離園，吃完晚餐上南山塔約8點，夜景最美、人潮也比傍晚少一些。今晚不趕，好好享受。',
    note:'',
    sections:[
      {label:'全天',type:'play',icon:'ti-confetti',spots:['愛寶樂園']},
      {label:'晚餐',type:'food',icon:'ti-bowl-chopsticks',spots:['馬鈴薯排骨湯']},
      {label:'夜景',type:'sight',icon:'ti-building-arch',spots:['南山首爾塔夜景（約20:00）']},
    ]
  },
  {
    id:'d7', numColor:'#444441', numBg:'#F1EFE8',
    title:'掃貨・汗蒸幕・離境',
    sub:'東大門 + 樂天超市掃貨 → 汗蒸幕放鬆 → AREX → 仁川 22:00 起飛',
    warn:'班機 22:00・建議 19:45 從弘大站搭AREX，抵達仁川約 20:30，留足 1.5 小時辦登機。',
    tip:'今天行程只有兩件事：掃貨和放鬆。高速巴士地下街、JYPE 上午順路逛，下午汗蒸幕泡到出發。不趕不亂。',
    note:'',
    sections:[
      {label:'上午・掃貨',type:'shop',icon:'ti-shopping-bag',spots:['東大門','高速巴士地下街','樂天超市','JYPE（順路）']},
      {label:'下午・放鬆',type:'play',icon:'ti-confetti',spots:['汗蒸幕']},
    ]
  }
];

let state = loadState();
let dragSrc = null;
let modalMode = null;
let modalTarget = null;
let editSpotTarget = null;

function defaultSections(){
  const out = {};
  DAYS_DATA.forEach(d=>{
    out[d.id] = d.sections.map(sec=>({
      label: sec.label,
      type: sec.type,
      icon: sec.icon,
      spots: [...sec.spots]
    }));
  });
  return out;
}

function loadState(){
  try{
    const s = localStorage.getItem('korea_trip_v3');
    if(s){ return JSON.parse(s); }
  }catch(e){}
  return {
    order: DAYS_DATA.map(d=>d.id),
    sections: defaultSections(),
    done: {},
    notes: {},
    titles: {},
    subs: {},
    open: {}
  };
}

function saveState(){
  if(!state.sections) state.sections = defaultSections();
  try{ localStorage.setItem('korea_trip_v3', JSON.stringify(state)); }catch(e){}
  if(fbTripRef){ state._client = CLIENT_ID; fbTripRef.set(state); }
}

function getSections(id){
  if(!state.sections) state.sections = defaultSections();
  if(!state.sections[id]){
    const d = DAYS_DATA.find(x=>x.id===id);
    state.sections[id] = d ? d.sections.map(sec=>({...sec, spots:[...sec.spots]})) : [];
  }
  return state.sections[id];
}

function getData(id){ return DAYS_DATA.find(d=>d.id===id); }

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }

function render(){
  const container = document.getElementById('days-container');
  container.innerHTML = '';
  const order = state.order || DAYS_DATA.map(d=>d.id);
  order.forEach((id, idx) => {
    const d = getData(id);
    if(!d) return;
    const isOpen = state.open[id];
    const title = state.titles[id] || d.title;
    const sub = state.subs[id] || d.sub;
    const note = state.notes[id] || '';
    const sections = getSections(id);

    const card = document.createElement('div');
    card.className = 'day-card';
    card.dataset.id = id;
    card.draggable = true;

    let sectionsHTML = '';
    sections.forEach((sec, si) => {
      const spotsHTML = sec.spots.map((spot, spi) => {
        const key = id+'::'+si+'::'+spi;
        const done = state.done[key];
        return `<span class="spot-wrap" style="display:inline-flex;align-items:center;gap:2px;">
          <span class="spot spot-${sec.type}${done?' done':''}" onclick="toggleSpot('${id}',${si},${spi},this)">
            <i class="ti ${sec.icon}" aria-hidden="true"></i>${escHtml(spot)}
          </span>
          <span class="spot-actions">
            <button class="spot-act-btn" title="重新命名" onclick="renameSpot('${id}',${si},${spi})"><i class="ti ti-pencil"></i></button>
            <button class="spot-act-btn del" title="刪除" onclick="deleteSpot('${id}',${si},${spi})"><i class="ti ti-x"></i></button>
          </span>
        </span>`;
      }).join('');
      const sid = `${id}-${si}`;
      sectionsHTML += `<div class="sec-label">${escHtml(sec.label)}</div><div class="spots" id="spots-${sid}">${spotsHTML}</div>`;
      sectionsHTML += `<div class="add-spot-row">
        <input class="add-input" placeholder="新增景點…" id="add-input-${sid}" onkeydown="if(event.key==='Enter'){event.preventDefault();addSpot('${id}',${si})}">
        <button class="add-btn" onclick="addSpot('${id}',${si})"><i class="ti ti-plus"></i> 新增</button>
      </div>`;
    });

    const warnHTML = d.warn ? `<div class="warn-box"><i class="ti ti-alert-triangle"></i><span>${d.warn}</span></div>` : '';
    const tipHTML = `<div class="tip-box"><i class="ti ti-bulb"></i><span>${d.tip}</span></div>`;
    const noteHTML = `<div class="note-row">
      <i class="ti ti-pencil" aria-hidden="true"></i>
      <textarea class="note-input" placeholder="備注…" rows="1"
        oninput="saveNote('${id}',this.value);autoResize(this)"
        onfocus="autoResize(this)">${escHtml(note)}</textarea>
    </div>`;

    card.innerHTML = `
      <div class="day-header" onclick="toggleDay('${id}')">
        <i class="ti ti-grip-vertical drag-handle" aria-hidden="true" onclick="event.stopPropagation()"></i>
        <div class="day-num" style="background:${d.numBg};color:${d.numColor};">D${idx+1}</div>
        <div class="day-meta">
          <div class="day-title">${escHtml(title)}</div>
          <div class="day-sub">${escHtml(sub)}</div>
        </div>
        <i class="ti ti-pencil" style="font-size:14px;color:#ccc;margin-right:4px;" aria-label="編輯標題" onclick="event.stopPropagation();openEditModal('${id}')"></i>
        <i class="ti ti-chevron-down day-chevron${isOpen?' open':''}" aria-hidden="true"></i>
      </div>
      <div class="day-body${isOpen?' open':''}">
        ${warnHTML}
        ${sectionsHTML}
        ${noteHTML}
        ${tipHTML}
      </div>
    `;

    card.addEventListener('dragstart', e => {
      dragSrc = id;
      setTimeout(()=>card.classList.add('dragging'),0);
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend', ()=>{ card.classList.remove('dragging'); dragSrc=null; });
    card.addEventListener('dragover', e=>{ e.preventDefault(); card.classList.add('drag-over'); });
    card.addEventListener('dragleave', ()=>card.classList.remove('drag-over'));
    card.addEventListener('drop', e=>{ e.preventDefault(); card.classList.remove('drag-over'); dropOn(id); });

    container.appendChild(card);
  });
  updateProgress();
}

function toggleDay(id){
  state.open[id] = !state.open[id];
  saveState(); render();
}
function expandAll(){ DAYS_DATA.forEach(d=>state.open[d.id]=true); saveState(); render(); }
function collapseAll(){ DAYS_DATA.forEach(d=>state.open[d.id]=false); saveState(); render(); }

function toggleSpot(id, si, spi, el){
  const key = id+'::'+si+'::'+spi;
  state.done[key] = !state.done[key];
  el.classList.toggle('done', state.done[key]);
  saveState(); updateProgress();
}

function deleteSpot(id, si, spi){
  const sec = getSections(id)[si];
  if(!sec) return;
  const spot = sec.spots[spi];
  if(!confirm(`刪除「${spot}」？`)) return;
  const key = id+'::'+si+'::'+spi;
  delete state.done[key];
  sec.spots.splice(spi, 1);
  state.open[id] = true;
  saveState(); render();
}

function renameSpot(id, si, spi){
  const sec = getSections(id)[si];
  if(!sec) return;
  const old = sec.spots[spi];
  editSpotTarget = {id, si, spi};
  modalMode = 'rename';
  document.getElementById('modal-title').textContent = '重新命名景點';
  document.getElementById('modal-desc').textContent = '輸入新的景點名稱';
  document.getElementById('modal-input').value = old;
  document.getElementById('modal-bg').classList.add('show');
  setTimeout(()=>{ const el=document.getElementById('modal-input'); el.focus(); el.select(); },100);
}

function saveNote(id, val){
  state.notes[id] = val;
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(saveState, 800);
}
function autoResize(el){
  el.style.height='auto';
  el.style.height=el.scrollHeight+'px';
}

function dropOn(targetId){
  if(!dragSrc || dragSrc===targetId) return;
  const order = [...state.order];
  const from = order.indexOf(dragSrc);
  const to = order.indexOf(targetId);
  order.splice(from,1);
  order.splice(to,0,dragSrc);
  state.order = order;
  saveState(); render();
}

function resetDone(){
  if(!confirm('確定要重置所有已勾選的景點嗎？')) return;
  state.done={};
  saveState(); render();
}

function updateProgress(){
  let total=0, done=0;
  const order = state.order || DAYS_DATA.map(d=>d.id);
  order.forEach(id=>{
    getSections(id).forEach((sec,si)=>{
      sec.spots.forEach((_,spi)=>{
        total++;
        if(state.done[id+'::'+si+'::'+spi]) done++;
      });
    });
  });
  const pct = total>0?Math.round(done/total*100):0;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-label').textContent=`${done} / ${total} 個景點`;
}

function addSpot(dayId, si){
  const sid = `${dayId}-${si}`;
  const input = document.getElementById(`add-input-${sid}`);
  const val = input ? input.value.trim() : '';
  if(!val) return;
  getSections(dayId)[si].spots.push(val);
  input.value='';
  state.open[dayId]=true;
  saveState(); render();
}

function openEditModal(id){
  const d = getData(id);
  modalMode='edit'; modalTarget=id;
  document.getElementById('modal-title').textContent='編輯行程標題';
  document.getElementById('modal-desc').textContent='修改這一天的主題與副標題（用換行分隔）';
  const t = state.titles[id]||d.title;
  const s = state.subs[id]||d.sub;
  document.getElementById('modal-input').value=t+'\n'+s;
  document.getElementById('modal-bg').classList.add('show');
}
function closeModal(e){ if(e.target===document.getElementById('modal-bg')) closeModalDirect(); }
function closeModalDirect(){ document.getElementById('modal-bg').classList.remove('show'); modalMode=null; editSpotTarget=null; }
function saveModal(){
  if(modalMode==='edit'){
    const lines = document.getElementById('modal-input').value.split('\n');
    state.titles[modalTarget] = lines[0]||'';
    state.subs[modalTarget] = lines.slice(1).join(' ')||'';
    state.open[modalTarget]=true;
    saveState(); render();
  } else if(modalMode==='rename' && editSpotTarget){
    const {id,si,spi} = editSpotTarget;
    const val = document.getElementById('modal-input').value.trim();
    if(val){
      getSections(id)[si].spots[spi] = val;
      state.open[id]=true;
      saveState(); render();
    }
  }
  closeModalDirect();
}

function copyText(){
  const order = state.order || DAYS_DATA.map(d=>d.id);
  let out = '🇰🇷 韓國 7 天 6 夜行程\n住宿：ITDA（弘大）\n\n';
  order.forEach((id,idx)=>{
    const d = getData(id);
    const title = state.titles[id]||d.title;
    const sub = state.subs[id]||d.sub;
    out += `【D${idx+1} ${title}】\n${sub}\n`;
    getSections(id).forEach(sec=>{
      if(sec.spots.length) out += `▸ ${sec.label}：${sec.spots.join('、')}\n`;
    });
    const note = state.notes[id];
    if(note) out += `📝 ${note}\n`;
    out += '\n';
  });
  navigator.clipboard.writeText(out).then(()=>showToast('已複製純文字版！'));
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

if(!state.order){ state.order = DAYS_DATA.map(d=>d.id); }
if(!state.sections){ state.sections = defaultSections(); }
render();
