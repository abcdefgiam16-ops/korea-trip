<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韓國 7 天 6 夜行程規劃</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh;}
  a{color:inherit;text-decoration:none;}

  /* header */
  .header{background:#fff;border-bottom:1px solid #e8e6e0;padding:18px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .header-title{font-size:18px;font-weight:600;flex:1;}
  .header-meta{font-size:13px;color:#888;display:flex;gap:16px;flex-wrap:wrap;}
  .header-meta span{display:flex;align-items:center;gap:4px;}

  /* layout */
  .main{max-width:900px;margin:0 auto;padding:20px 16px 60px;}

  /* info bar */
  .info-bar{background:#EEEDFE;border-radius:10px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:10px;font-size:14px;color:#3C3489;}
  .info-bar i{font-size:18px;flex-shrink:0;}

  /* legend */
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .leg-item{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:20px;}
  .leg-shop{background:#EEEDFE;color:#3C3489;}
  .leg-food{background:#FAEEDA;color:#633806;}
  .leg-play{background:#E1F5EE;color:#085041;}
  .leg-sight{background:#FAECE7;color:#712B13;}

  /* day card */
  .day-card{background:#fff;border:1px solid #e8e6e0;border-radius:12px;margin-bottom:12px;overflow:hidden;transition:box-shadow .15s;}
  .day-card.dragging{opacity:.5;}
  .day-card.drag-over{border:2px dashed #7F77DD;}

  .day-header{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none;}
  .day-header:hover{background:#fafaf8;}
  .drag-handle{color:#ccc;cursor:grab;font-size:18px;flex-shrink:0;}
  .drag-handle:active{cursor:grabbing;}
  .day-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0;}
  .day-meta{flex:1;min-width:0;}
  .day-title{font-size:15px;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .day-sub{font-size:12px;color:#888;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .day-chevron{font-size:16px;color:#bbb;transition:transform .2s;flex-shrink:0;}
  .day-chevron.open{transform:rotate(180deg);}

  /* day body */
  .day-body{display:none;padding:0 16px 16px;}
  .day-body.open{display:block;}

  .sec-label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#aaa;margin:14px 0 8px;display:flex;align-items:center;gap:5px;}
  .sec-rename-btn{background:none;border:none;cursor:pointer;padding:1px 3px;border-radius:3px;color:#ddd;font-size:11px;line-height:1;display:inline-flex;align-items:center;flex-shrink:0;}
  .sec-rename-btn:hover{background:#f0eeee;color:#888;}
  .spots{display:flex;flex-wrap:wrap;gap:6px;}

  /* spot chip */
  .spot{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 11px;border-radius:20px;cursor:pointer;transition:opacity .15s;border:1.5px solid transparent;user-select:none;}
  .spot.done{opacity:.35;text-decoration:line-through;}
  .spot i{font-size:14px;}
  .spot-shop{background:#EEEDFE;color:#3C3489;border-color:#CECBF6;}
  .spot-food{background:#FAEEDA;color:#633806;border-color:#FAC775;}
  .spot-play{background:#E1F5EE;color:#085041;border-color:#9FE1CB;}
  .spot-sight{background:#FAECE7;color:#712B13;border-color:#F5C4B3;}

  /* note */
  .note-row{margin-top:14px;display:flex;gap:8px;align-items:flex-start;}
  .note-row i{font-size:15px;color:#aaa;margin-top:9px;flex-shrink:0;}
  .note-input{flex:1;border:1px solid #e8e6e0;border-radius:8px;padding:8px 10px;font-size:13px;color:#1a1a1a;resize:none;font-family:inherit;background:#fafaf8;line-height:1.5;min-height:36px;}
  .note-input:focus{outline:none;border-color:#7F77DD;background:#fff;}
  .note-input::placeholder{color:#bbb;}

  /* tip */
  .tip-box{margin-top:12px;font-size:12px;color:#888;background:#fafaf8;border-radius:8px;padding:9px 12px;display:flex;gap:7px;align-items:flex-start;}
  .tip-box i{font-size:14px;flex-shrink:0;margin-top:1px;}

  /* warn */
  .warn-box{margin-top:10px;font-size:12px;color:#791F1F;background:#FCEBEB;border-radius:8px;padding:9px 12px;display:flex;gap:7px;align-items:flex-start;}
  .warn-box i{font-size:14px;flex-shrink:0;margin-top:1px;}
  .add-warn-btn{margin-top:8px;background:none;border:1.5px dashed #f0d0d0;border-radius:6px;padding:5px 10px;font-size:11px;color:#cdb;cursor:pointer;display:flex;align-items:center;gap:5px;width:100%;color:#d0a0a0;}
  .add-warn-btn:hover{color:#a04040;border-color:#c08080;background:#fff8f8;}
  /* box edit btn */
  .box-edit-btn{flex-shrink:0;margin-left:auto;background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:4px;color:#ccc;font-size:12px;line-height:1;display:inline-flex;align-items:center;align-self:flex-start;margin-top:-1px;}
  .warn-box .box-edit-btn:hover{background:rgba(120,0,0,.08);color:#791F1F;}
  .tip-box .box-edit-btn:hover{background:rgba(0,0,0,.06);color:#555;}

  /* spot action buttons */
  .spot-wrap{position:relative;display:inline-flex;align-items:center;gap:2px;}
  .spot-actions{display:none;align-items:center;gap:1px;}
  .spot-wrap:hover .spot-actions{display:inline-flex;}
  .spot-act-btn{background:none;border:none;cursor:pointer;padding:3px 4px;border-radius:4px;color:#bbb;font-size:13px;line-height:1;display:flex;align-items:center;}
  .spot-act-btn:hover{background:#f0eeee;color:#555;}
  .spot-act-btn.del:hover{background:#FCEBEB;color:#791F1F;}
  @media(hover:none){.spot-actions{display:inline-flex;}}

  /* add-spot */
  .add-spot-row{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .add-input{border:1px solid #e8e6e0;border-radius:8px;padding:6px 10px;font-size:13px;color:#1a1a1a;background:#fafaf8;font-family:inherit;width:160px;}
  .add-input:focus{outline:none;border-color:#7F77DD;background:#fff;}
  .cat-sel{border:1px solid #e8e6e0;border-radius:8px;padding:6px 8px;font-size:13px;background:#fafaf8;color:#555;font-family:inherit;}
  .cat-sel:focus{outline:none;border-color:#7F77DD;}
  .add-btn{border:1px solid #e8e6e0;border-radius:8px;padding:6px 12px;font-size:13px;background:#fff;cursor:pointer;color:#555;display:flex;align-items:center;gap:4px;}
  .add-btn:hover{background:#EEEDFE;color:#3C3489;border-color:#AFA9EC;}

  /* toolbar */
  .toolbar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tool-btn{border:1px solid #e8e6e0;border-radius:8px;padding:7px 14px;font-size:13px;background:#fff;cursor:pointer;color:#555;display:flex;align-items:center;gap:6px;}
  .tool-btn:hover{background:#f5f4f0;}
  .tool-btn.primary{background:#534AB7;color:#fff;border-color:#534AB7;}
  .tool-btn.primary:hover{background:#3C3489;}

  /* progress */
  .progress-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .progress-bar{flex:1;height:6px;background:#e8e6e0;border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:#534AB7;border-radius:3px;transition:width .3s;}
  .progress-label{font-size:12px;color:#888;white-space:nowrap;}

  /* modal */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;align-items:center;justify-content:center;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:14px;padding:24px;max-width:440px;width:90%;max-height:80vh;overflow-y:auto;}
  .modal h3{font-size:16px;font-weight:600;margin-bottom:4px;}
  .modal p{font-size:13px;color:#888;margin-bottom:16px;}
  .modal textarea{width:100%;border:1px solid #e8e6e0;border-radius:8px;padding:10px;font-size:13px;font-family:inherit;resize:vertical;min-height:120px;color:#1a1a1a;}
  .modal textarea:focus{outline:none;border-color:#7F77DD;}
  .modal input[type="time"]{border:1px solid #e8e6e0;border-radius:8px;padding:9px 10px;font-size:15px;color:#1a1a1a;background:#fafaf8;width:100%;}
  .modal input[type="time"]:focus{outline:none;border-color:#7F77DD;background:#fff;}
  .modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
  .modal-actions button{border:1px solid #e8e6e0;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;background:#fff;color:#555;}
  .modal-actions .ok-btn{background:#534AB7;color:#fff;border-color:#534AB7;}
  .modal-actions .ok-btn:hover{background:#3C3489;}

  /* copy toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:200;}
  .toast.show{opacity:1;}

  /* ── timetable ── */
  .timetable-section{margin-top:32px;padding-top:24px;border-top:2px solid #e8e6e0;}
  .timetable-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .timetable-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;color:#1a1a1a;}
  .timetable-hint{font-size:12px;color:#bbb;}
  .tl-row{display:flex;align-items:flex-start;border:1px solid #e8e6e0;border-radius:10px;margin-bottom:8px;background:#fff;overflow:hidden;}
  .tl-day-label{padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;background:#fafaf8;border-right:1px solid #e8e6e0;min-width:64px;flex-shrink:0;}
  .tl-day-name{font-size:10px;color:#aaa;text-align:center;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tl-spots{flex:1;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:50px;}
  .tl-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:20px;cursor:grab;border:1.5px solid transparent;user-select:none;transition:opacity .15s;}
  .tl-chip:active{cursor:grabbing;}
  .tl-chip i{font-size:13px;}
  .tl-num{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.13);font-size:9px;font-weight:700;flex-shrink:0;}
  .tl-chip.tl-dragging{opacity:.3;}
  .tl-chip.drop-before{border-left:3px solid #534AB7!important;padding-left:8px;}
  .tl-chip.drop-after{border-right:3px solid #534AB7!important;padding-right:8px;}
  .tl-empty{font-size:12px;color:#ccc;font-style:italic;}
  .tl-time-badge{margin-left:3px;font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(0,0,0,.08);color:#888;cursor:pointer;white-space:nowrap;flex-shrink:0;line-height:1.7;transition:background .15s,color .15s;}
  .tl-time-badge:hover{background:rgba(83,74,183,.14);color:#534AB7;}
  .tl-time-badge.no-time{background:transparent;color:#ccc;}
  .tl-time-badge.no-time:hover{background:rgba(83,74,183,.1);color:#534AB7;}
  .timetable-footer{margin-top:14px;display:flex;justify-content:flex-end;}

  @media(max-width:600px){
    .tl-day-label{min-width:50px;padding:8px 8px;}
    .tl-chip{font-size:11px;padding:3px 8px;}
  }

  @media(max-width:600px){
    .day-title{font-size:14px;}
    .day-sub{font-size:11px;}
    .header{padding:12px 14px;}
    .header-title{font-size:16px;}
    .header-meta{font-size:12px;gap:10px;}
    .main{padding:14px 12px 60px;}
    .toolbar{gap:6px;}
    .tool-btn{padding:6px 10px;font-size:12px;}
    .spot{font-size:12px;padding:4px 9px;}
    .add-input{width:130px;font-size:12px;}
    .add-btn{font-size:12px;padding:5px 10px;}
    .info-bar{font-size:13px;}
    .modal{padding:18px;}
    .modal textarea{font-size:14px;}
    .modal-actions button{padding:10px 16px;font-size:14px;}
  }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="header">
  <i class="ti ti-plane" style="font-size:22px;color:#534AB7;" aria-hidden="true"></i>
  <div class="header-title">韓國 7 天 6 夜行程</div>
  <div class="header-meta">
    <span><i class="ti ti-home-2" aria-hidden="true"></i> ITDA・弘大</span>
    <span><i class="ti ti-clock" aria-hidden="true"></i> D1 凌晨5:00 仁川落地</span>
    <span id="sync-status" style="transition:color .3s;color:#bbb;"><i class="ti ti-cloud" aria-hidden="true"></i> 連線中…</span>
  </div>
</div>

<div class="main">
  <div class="info-bar">
    <i class="ti ti-info-circle" aria-hidden="true"></i>
    <span>點擊景點可標記已完成・可新增備注・拖曳卡片調整天數順序</span>
  </div>

  <div class="legend">
    <span class="leg-item leg-shop"><i class="ti ti-shopping-bag"></i>逛街</span>
    <span class="leg-item leg-food"><i class="ti ti-bowl-chopsticks"></i>吃的</span>
    <span class="leg-item leg-play"><i class="ti ti-confetti"></i>玩的</span>
    <span class="leg-item leg-sight"><i class="ti ti-building-arch"></i>景點</span>
  </div>

  <div class="progress-row">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-label" id="progress-label">0 / 0 個景點</div>
  </div>

  <div class="toolbar">
    <button class="tool-btn" onclick="expandAll()"><i class="ti ti-chevrons-down"></i> 展開全部</button>
    <button class="tool-btn" onclick="collapseAll()"><i class="ti ti-chevrons-up"></i> 收合全部</button>
    <button class="tool-btn" onclick="resetDone()"><i class="ti ti-refresh"></i> 重置勾選</button>
    <button class="tool-btn primary" onclick="copyText()"><i class="ti ti-copy"></i> 複製純文字版</button>
    <button class="tool-btn" onclick="exportSchedule()"><i class="ti ti-calendar-stats"></i> 輸出行程表</button>
    <button class="tool-btn" style="margin-left:auto;" onclick="shareLink()"><i class="ti ti-share-2"></i> 分享給旅伴</button>
  </div>
  <div id="online-bar" style="display:none;margin-bottom:12px;font-size:12px;color:#888;display:flex;align-items:center;gap:6px;">
    <span id="online-dots" style="display:flex;gap:4px;"></span>
    <span id="online-text"></span>
  </div>

  <div id="days-container"></div>

  <!-- 時間表 -->
  <div class="timetable-section">
    <div class="timetable-header">
      <div class="timetable-title"><i class="ti ti-calendar-week"></i> 行程時間表</div>
      <span class="timetable-hint">拖曳方塊調整當天先後順序</span>
    </div>
    <div id="timetable-grid"></div>
    <div class="timetable-footer">
      <button class="tool-btn primary" onclick="exportTimeline()"><i class="ti ti-file-export"></i> 輸出時間表</button>
    </div>
  </div>
</div>

<!-- modal -->
<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal">
    <h3 id="modal-title">編輯行程標題</h3>
    <p id="modal-desc">修改這一天的主題或副標題</p>
    <textarea id="modal-input"></textarea>
    <div id="modal-time-wrap" style="display:none;">
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
        <input type="time" id="modal-time-start">
        <span style="color:#aaa;font-size:16px;">–</span>
        <input type="time" id="modal-time-end">
      </div>
      <p style="font-size:12px;color:#bbb;margin-top:8px;">結束時間可以留空</p>
    </div>
    <div class="modal-actions">
      <button onclick="closeModalDirect()">取消</button>
      <button id="modal-clear-btn" style="display:none;color:#a04040;" onclick="clearSpotTime()">清除時間</button>
      <button class="ok-btn" onclick="saveModal()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

const CLIENT_ID = Date.now().toString(36) + Math.random().toString(36).slice(2);
let pendingRemoteUpdate = false;
let noteSaveTimer = null;
let fbTripRef = null;

    note:'',
    sections:[
      {label:'上午・掃貨',type:'shop',icon:'ti-shopping-bag',spots:['東大門','高速巴士地下街','樂天超市','JYPE（順路）']},

let state = loadState();
let dragSrc = null;
let modalMode = null;
let modalTarget = null;
let editSpotTarget = null;
let tlDragSrc = null;

function defaultSections(){
  const out = {};
  DAYS_DATA.forEach(d=>{
    out[d.id] = d.sections.map(sec=>({
      label: sec.label,
      type: sec.type,
      icon: sec.icon,
      spots: [...sec.spots]
    }));
  });
  return out;
}

function defaultState(){
  return { order: DAYS_DATA.map(d=>d.id), sections: defaultSections(), done:{}, notes:{}, titles:{}, subs:{}, warns:{}, tips:{}, timelineOrder:{}, spotTimes:{}, open:{} };
}

function loadState(){
  try{
    const s = localStorage.getItem('korea_trip_v3');
    if(s){
      const d = JSON.parse(s);
      // 驗證：order 必須是含有效 ID 的陣列
      if(d && Array.isArray(d.order) && d.order.length > 0 && d.order.every(id => DAYS_DATA.some(x=>x.id===id)))
        return d;
    }
  }catch(e){}
  localStorage.removeItem('korea_trip_v3'); // 清掉損壞的快取
  return defaultState();
}

function saveState(){
  if(!state.sections) state.sections = defaultSections();
  try{ localStorage.setItem('korea_trip_v3', JSON.stringify(state)); }catch(e){}
  if(fbTripRef){ state._client = CLIENT_ID; fbTripRef.set({json: JSON.stringify(state)}); }
}

function getSections(id){
  if(!state.sections) state.sections = defaultSections();
  if(!state.sections[id]){
    const d = DAYS_DATA.find(x=>x.id===id);
    state.sections[id] = d ? d.sections.map(sec=>({...sec, spots:[...sec.spots]})) : [];
  }
  return state.sections[id];
}

function getData(id){ return DAYS_DATA.find(d=>d.id===id); }

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }

function render(){
  const container = document.getElementById('days-container');
  container.innerHTML = '';
  const order = state.order || DAYS_DATA.map(d=>d.id);
  order.forEach((id, idx) => {
    const d = getData(id);
    if(!d) return;
    const isOpen = state.open[id];
    const title = state.titles[id] || d.title;
    const sub = state.subs[id] || d.sub;
    const note = state.notes[id] || '';
    const sections = getSections(id);

    const card = document.createElement('div');
    card.className = 'day-card';
    card.dataset.id = id;
    card.draggable = true;

    let sectionsHTML = '';
    sections.forEach((sec, si) => {
      if(!sec) return;
      if(!Array.isArray(sec.spots)) sec.spots = [];
      const spotsHTML = sec.spots.map((spot, spi) => {
        const key = id+'::'+si+'::'+spi;
        const done = state.done[key];
        return `<span class="spot-wrap" style="display:inline-flex;align-items:center;gap:2px;">
          <span class="spot spot-${sec.type}${done?' done':''}" onclick="toggleSpot('${id}',${si},${spi},this)">
            <i class="ti ${sec.icon}" aria-hidden="true"></i>${escHtml(spot)}
          </span>
          <span class="spot-actions">
            <button class="spot-act-btn" title="重新命名" onclick="renameSpot('${id}',${si},${spi})"><i class="ti ti-pencil"></i></button>
            <button class="spot-act-btn del" title="刪除" onclick="deleteSpot('${id}',${si},${spi})"><i class="ti ti-x"></i></button>
          </span>
        </span>`;
      }).join('');
      const sid = `${id}-${si}`;
      sectionsHTML += `<div class="sec-label">${escHtml(sec.label)}<button class="sec-rename-btn" onclick="renameSection('${id}',${si})" title="重新命名分類"><i class="ti ti-pencil"></i></button></div><div class="spots" id="spots-${sid}">${spotsHTML}</div>`;
      sectionsHTML += `<div class="add-spot-row">
        <input class="add-input" placeholder="新增景點…" id="add-input-${sid}" onkeydown="if(event.key==='Enter'){event.preventDefault();addSpot('${id}',${si})}">
        <select class="cat-sel" id="add-type-${sid}">
          <option value="shop"${sec.type==='shop'?' selected':''}>逛街</option>
          <option value="food"${sec.type==='food'?' selected':''}>吃的</option>
          <option value="play"${sec.type==='play'?' selected':''}>玩的</option>
          <option value="sight"${sec.type==='sight'?' selected':''}>景點</option>
        </select>
        <button class="add-btn" onclick="addSpot('${id}',${si})"><i class="ti ti-plus"></i> 新增</button>
      </div>`;
    });

    const warnText = (state.warns && state.warns[id] !== undefined) ? state.warns[id] : d.warn;
    const tipText  = (state.tips  && state.tips[id]  !== undefined) ? state.tips[id]  : d.tip;
    const warnHTML = warnText
      ? `<div class="warn-box"><i class="ti ti-alert-triangle" style="flex-shrink:0;margin-top:1px;"></i><span style="flex:1;">${escHtml(warnText)}</span><button class="box-edit-btn" onclick="editBoxText('${id}','warn')" title="編輯注意事項"><i class="ti ti-pencil"></i></button></div>`
      : `<button class="add-warn-btn" onclick="editBoxText('${id}','warn')"><i class="ti ti-alert-triangle"></i> 新增注意事項</button>`;
    const tipHTML = `<div class="tip-box"><i class="ti ti-bulb" style="flex-shrink:0;margin-top:1px;"></i><span style="flex:1;">${escHtml(tipText)}</span><button class="box-edit-btn" onclick="editBoxText('${id}','tip')" title="編輯小提示"><i class="ti ti-pencil"></i></button></div>`;
    const noteHTML = `<div class="note-row">
      <i class="ti ti-pencil" aria-hidden="true"></i>
      <textarea class="note-input" placeholder="備注…" rows="1"
        oninput="saveNote('${id}',this.value);autoResize(this)"
        onfocus="autoResize(this)">${escHtml(note)}</textarea>
    </div>`;

    card.innerHTML = `
      <div class="day-header" onclick="toggleDay('${id}')">
        <i class="ti ti-grip-vertical drag-handle" aria-hidden="true" onclick="event.stopPropagation()"></i>
        <div class="day-num" style="background:${d.numBg};color:${d.numColor};">D${idx+1}</div>
        <div class="day-meta">
          <div class="day-title">${escHtml(title)}</div>
          <div class="day-sub">${escHtml(sub)}</div>
        </div>
        <i class="ti ti-pencil" style="font-size:14px;color:#ccc;margin-right:4px;" aria-label="編輯標題" onclick="event.stopPropagation();openEditModal('${id}')"></i>
        <i class="ti ti-chevron-down day-chevron${isOpen?' open':''}" aria-hidden="true"></i>
      </div>
      <div class="day-body${isOpen?' open':''}">
        ${warnHTML}
        ${sectionsHTML}
        ${noteHTML}
        ${tipHTML}
      </div>
    `;

    card.addEventListener('dragstart', e => {
      dragSrc = id;
      setTimeout(()=>card.classList.add('dragging'),0);
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend', ()=>{ card.classList.remove('dragging'); dragSrc=null; });
    card.addEventListener('dragover', e=>{ e.preventDefault(); card.classList.add('drag-over'); });
    card.addEventListener('dragleave', ()=>card.classList.remove('drag-over'));
    card.addEventListener('drop', e=>{ e.preventDefault(); card.classList.remove('drag-over'); dropOn(id); });

    container.appendChild(card);
  });
  updateProgress();
  renderTimeline();
}

function toggleDay(id){
  state.open[id] = !state.open[id];
  saveState(); render();
}
function expandAll(){ DAYS_DATA.forEach(d=>state.open[d.id]=true); saveState(); render(); }
function collapseAll(){ DAYS_DATA.forEach(d=>state.open[d.id]=false); saveState(); render(); }

function toggleSpot(id, si, spi, el){
  const key = id+'::'+si+'::'+spi;
  state.done[key] = !state.done[key];
  el.classList.toggle('done', state.done[key]);
  saveState(); updateProgress();
}

function deleteSpot(id, si, spi){
  const sec = getSections(id)[si];
  if(!sec) return;
  const spot = sec.spots[spi];
  if(!confirm(`刪除「${spot}」？`)) return;
  const key = id+'::'+si+'::'+spi;
  delete state.done[key];
  sec.spots.splice(spi, 1);
  state.open[id] = true;
  saveState(); render();
}

function renameSpot(id, si, spi){
  const sec = getSections(id)[si];
  if(!sec) return;
  const old = sec.spots[spi];
  editSpotTarget = {id, si, spi};
  modalMode = 'rename';
  document.getElementById('modal-title').textContent = '重新命名景點';
  document.getElementById('modal-desc').textContent = '輸入新的景點名稱';
  document.getElementById('modal-input').value = old;
  document.getElementById('modal-bg').classList.add('show');
  setTimeout(()=>{ const el=document.getElementById('modal-input'); el.focus(); el.select(); },100);
}

function renameSection(dayId, si){
  const sec = getSections(dayId)[si];
  if(!sec) return;
  editSpotTarget = {dayId, si};
  modalMode = 'rename-section';
  document.getElementById('modal-title').textContent = '重新命名分類';
  document.getElementById('modal-desc').textContent = '輸入新的分類名稱（例如：上午、晚餐、購物…）';
  document.getElementById('modal-input').value = sec.label;
  document.getElementById('modal-bg').classList.add('show');
  setTimeout(()=>{ const el=document.getElementById('modal-input'); el.focus(); el.select(); },100);
}

function editBoxText(id, type){
  const d = getData(id);
  const cur = type==='warn'
    ? ((state.warns && state.warns[id] !== undefined) ? state.warns[id] : d.warn)
    : ((state.tips  && state.tips[id]  !== undefined) ? state.tips[id]  : d.tip);
  editSpotTarget = {id, boxType: type};
  modalMode = 'edit-box';
  document.getElementById('modal-title').textContent = type==='warn' ? '編輯注意事項' : '編輯小提示';
  document.getElementById('modal-desc').textContent  = type==='warn' ? '修改紅色注意事項（清空則隱藏）' : '修改燈泡小提示';
  document.getElementById('modal-input').value = cur;
  document.getElementById('modal-bg').classList.add('show');
  setTimeout(()=>document.getElementById('modal-input').focus(), 100);
}

function saveNote(id, val){
  state.notes[id] = val;
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(saveState, 800);
}
function autoResize(el){
  el.style.height='auto';
  el.style.height=el.scrollHeight+'px';
}

function dropOn(targetId){
  if(!dragSrc || dragSrc===targetId) return;
  const order = [...state.order];
  const from = order.indexOf(dragSrc);
  const to = order.indexOf(targetId);
  order.splice(from,1);
  order.splice(to,0,dragSrc);
  state.order = order;
  saveState(); render();
}

function resetDone(){
  if(!confirm('確定要重置所有已勾選的景點嗎？')) return;
  state.done={};
  saveState(); render();
}

function updateProgress(){
  let total=0, done=0;
  const order = state.order || DAYS_DATA.map(d=>d.id);
  order.forEach(id=>{
    getSections(id).forEach((sec,si)=>{
      sec.spots.forEach((_,spi)=>{
        total++;
        if(state.done[id+'::'+si+'::'+spi]) done++;
      });
    });
  });
  const pct = total>0?Math.round(done/total*100):0;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-label').textContent=`${done} / ${total} 個景點`;
}

function addSpot(dayId, si){
  const sid = `${dayId}-${si}`;
  const input = document.getElementById(`add-input-${sid}`);
  const typeEl = document.getElementById(`add-type-${sid}`);
  const val = input ? input.value.trim() : '';
  if(!val) return;
  const sections = getSections(dayId);
  const selectedType = typeEl ? typeEl.value : sections[si].type;
  let targetSi = sections.findIndex(s => s.type === selectedType);
  if(targetSi < 0){
    const META = {
      shop:{label:'逛街',icon:'ti-shopping-bag'},
      food:{label:'吃的',icon:'ti-bowl-chopsticks'},
      play:{label:'玩的',icon:'ti-confetti'},
      sight:{label:'景點',icon:'ti-building-arch'}
    };
    const m = META[selectedType];
    sections.push({label:m.label, type:selectedType, icon:m.icon, spots:[]});
    targetSi = sections.length - 1;
  }
  sections[targetSi].spots.push(val);
  input.value='';
  state.open[dayId]=true;
  saveState(); render();
}

function openEditModal(id){
  const d = getData(id);
  modalMode='edit'; modalTarget=id;
  document.getElementById('modal-title').textContent='編輯行程標題';
  document.getElementById('modal-desc').textContent='修改這一天的主題與副標題（用換行分隔）';
  const t = state.titles[id]||d.title;
  const s = state.subs[id]||d.sub;
  document.getElementById('modal-input').value=t+'\n'+s;
  document.getElementById('modal-bg').classList.add('show');
}
function closeModal(e){ if(e.target===document.getElementById('modal-bg')) closeModalDirect(); }
function closeModalDirect(){
  document.getElementById('modal-bg').classList.remove('show');
  document.getElementById('modal-input').style.display = '';
  document.getElementById('modal-time-wrap').style.display = 'none';
  document.getElementById('modal-clear-btn').style.display = 'none';
  modalMode=null; editSpotTarget=null;
}
function saveModal(){
  if(modalMode==='edit'){
    const lines = document.getElementById('modal-input').value.split('\n');
    state.titles[modalTarget] = lines[0]||'';
    state.subs[modalTarget] = lines.slice(1).join(' ')||'';
    state.open[modalTarget]=true;
    saveState(); render();
  } else if(modalMode==='rename' && editSpotTarget){
    const {id,si,spi} = editSpotTarget;
    const val = document.getElementById('modal-input').value.trim();
    if(val){
      getSections(id)[si].spots[spi] = val;
      state.open[id]=true;
      saveState(); render();
    }
  } else if(modalMode==='rename-section' && editSpotTarget){
    const {dayId,si} = editSpotTarget;
    const val = document.getElementById('modal-input').value.trim();
    if(val){
      getSections(dayId)[si].label = val;
      state.open[dayId]=true;
      saveState(); render();
    }
  } else if(modalMode==='edit-time' && editSpotTarget){
    const {dayId, spotName} = editSpotTarget;
    const key = dayId + '::' + spotName;
    const start = document.getElementById('modal-time-start').value;
    const end   = document.getElementById('modal-time-end').value;
    if(!state.spotTimes) state.spotTimes = {};
    if(start || end) state.spotTimes[key] = {start, end};
    else delete state.spotTimes[key];
    saveState(); renderTimeline();
  } else if(modalMode==='edit-box' && editSpotTarget){
    const {id, boxType} = editSpotTarget;
    const val = document.getElementById('modal-input').value.trim();
    if(!state.warns) state.warns = {};
    if(!state.tips)  state.tips  = {};
    if(boxType==='warn') state.warns[id] = val;
    else                 state.tips[id]  = val;
    state.open[id]=true;
    saveState(); render();
  }
  closeModalDirect();
}

function copyText(){
  const order = state.order || DAYS_DATA.map(d=>d.id);
  let out = '🇰🇷 韓國 7 天 6 夜行程\n住宿：ITDA（弘大）\n\n';
  order.forEach((id,idx)=>{
    const d = getData(id);
    const title = state.titles[id]||d.title;
    const sub = state.subs[id]||d.sub;
    out += `【D${idx+1} ${title}】\n${sub}\n`;
    getSections(id).forEach(sec=>{
      if(sec.spots.length) out += `▸ ${sec.label}：${sec.spots.join('、')}\n`;
    });
    const note = state.notes[id];
    if(note) out += `📝 ${note}\n`;
    const warn = (state.warns && state.warns[id] !== undefined) ? state.warns[id] : d.warn;
    if(warn) out += `⚠️ ${warn}\n`;
    out += '\n';
  });
  navigator.clipboard.writeText(out).then(()=>showToast('已複製純文字版！'));
}

function editSpotTime(dayId, spotName){
  editSpotTarget = {dayId, spotName};
  modalMode = 'edit-time';
  document.getElementById('modal-title').textContent = '設定時間';
  document.getElementById('modal-desc').textContent = spotName;
  document.getElementById('modal-input').style.display = 'none';
  document.getElementById('modal-time-wrap').style.display = 'block';
  document.getElementById('modal-clear-btn').style.display = '';
  const key = dayId + '::' + spotName;
  const t = state.spotTimes && state.spotTimes[key];
  document.getElementById('modal-time-start').value = t ? (t.start||'') : '';
  document.getElementById('modal-time-end').value   = t ? (t.end||'')   : '';
  document.getElementById('modal-bg').classList.add('show');
  setTimeout(()=>document.getElementById('modal-time-start').focus(), 100);
}

function clearSpotTime(){
  if(!editSpotTarget) return;
  const {dayId, spotName} = editSpotTarget;
  const key = dayId + '::' + spotName;
  if(state.spotTimes) delete state.spotTimes[key];
  saveState(); renderTimeline();
  closeModalDirect();
}

// ── Timeline helpers ──────────────────────────────────────────
function getTimelineOrder(dayId){
  if(!state.timelineOrder) state.timelineOrder = {};
  const sections = getSections(dayId);
  const allSpots = [];
  sections.forEach(sec => {
    if(!sec || !Array.isArray(sec.spots)) return;
    sec.spots.forEach(name => allSpots.push(name));
  });
  const saved = state.timelineOrder[dayId];
  if(!saved || saved.length === 0) return allSpots;
  const result = [];
  const remaining = [...allSpots];
  saved.forEach(name => {
    const idx = remaining.indexOf(name);
    if(idx >= 0){ result.push(name); remaining.splice(idx,1); }
  });
  remaining.forEach(n => result.push(n));
  return result;
}

function renderTimeline(){
  const grid = document.getElementById('timetable-grid');
  if(!grid) return;
  grid.innerHTML = '';
  const order = state.order || DAYS_DATA.map(d=>d.id);
  order.forEach((id, idx) => {
    const d = getData(id);
    if(!d) return;
    const title = state.titles[id] || d.title;
    const sections = getSections(id);
    const spotOrder = getTimelineOrder(id);
    const spotInfo = {};
    sections.forEach(sec => {
      if(!sec || !Array.isArray(sec.spots)) return;
      sec.spots.forEach(name => { if(!spotInfo[name]) spotInfo[name] = {type:sec.type, icon:sec.icon}; });
    });

    const row = document.createElement('div');
    row.className = 'tl-row';

    const label = document.createElement('div');
    label.className = 'tl-day-label';
    label.innerHTML = `<div class="day-num" style="width:28px;height:28px;font-size:11px;background:${d.numBg};color:${d.numColor};">D${idx+1}</div><div class="tl-day-name">${escHtml(title.replace(/・.*/,''))}</div>`;
    row.appendChild(label);

    const spotsDiv = document.createElement('div');
    spotsDiv.className = 'tl-spots';

    if(spotOrder.length === 0){
      spotsDiv.innerHTML = '<span class="tl-empty">展開上方卡片新增景點</span>';
    } else {
      spotOrder.forEach((name, i) => {
        const info = spotInfo[name] || {type:'sight', icon:'ti-building-arch'};
        const chip = document.createElement('div');
        chip.className = `tl-chip spot-${info.type}`;
        chip.draggable = true;
        chip.dataset.dayId = id;
        chip.dataset.idx = i;
        const tk = id + '::' + name;
        const td = state.spotTimes && state.spotTimes[tk];
        const tStr = td ? (td.start + (td.end ? '–'+td.end : '')) : '';
        chip.innerHTML = `<span class="tl-num">${i+1}</span><i class="ti ${info.icon}"></i><span>${escHtml(name)}</span><span class="tl-time-badge${tStr?'':' no-time'}">${tStr ? escHtml(tStr) : '<i class="ti ti-clock-plus"></i>'}</span>`;

        const timeBadge = chip.querySelector('.tl-time-badge');
        if(timeBadge){
          timeBadge.draggable = false;
          timeBadge.addEventListener('click', e => { e.stopPropagation(); editSpotTime(id, name); });
        }

        chip.addEventListener('dragstart', e => {
          tlDragSrc = {dayId:id, idx:i, name};
          chip.classList.add('tl-dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.stopPropagation();
        });
        chip.addEventListener('dragend', () => {
          chip.classList.remove('tl-dragging');
          document.querySelectorAll('.tl-chip').forEach(c => c.classList.remove('drop-before','drop-after'));
        });
        chip.addEventListener('dragover', e => {
          e.preventDefault(); e.stopPropagation();
          if(!tlDragSrc || tlDragSrc.dayId !== id) return;
          document.querySelectorAll(`[data-day-id="${id}"].tl-chip`).forEach(c => c.classList.remove('drop-before','drop-after'));
          const rect = chip.getBoundingClientRect();
          chip.classList.add(e.clientX < rect.left + rect.width/2 ? 'drop-before' : 'drop-after');
        });
        chip.addEventListener('dragleave', () => chip.classList.remove('drop-before','drop-after'));
        chip.addEventListener('drop', e => {
          e.preventDefault(); e.stopPropagation();
          chip.classList.remove('drop-before','drop-after');
          if(!tlDragSrc || tlDragSrc.dayId !== id || tlDragSrc.idx === i) return;
          const rect = chip.getBoundingClientRect();
          const insertBefore = e.clientX < rect.left + rect.width/2;
          const current = getTimelineOrder(id);
          const from = tlDragSrc.idx, to = i;
          const [moved] = current.splice(from, 1);
          let at = to;
          if(from < to && insertBefore) at = to - 1;
          if(from > to && !insertBefore) at = to + 1;
          current.splice(Math.max(0, Math.min(at, current.length)), 0, moved);
          if(!state.timelineOrder) state.timelineOrder = {};
          state.timelineOrder[id] = current;
          tlDragSrc = null;
          saveState(); renderTimeline();
        });

        spotsDiv.appendChild(chip);
      });
    }
    row.appendChild(spotsDiv);
    grid.appendChild(row);
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

function shareLink(){
  const url = window.location.href.split('?')[0].split('#')[0];
  if(navigator.share){
    navigator.share({ title:'韓國 7 天 6 夜行程', url }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(url)
      .then(()=>showToast('已複製分享連結，傳給旅伴就能一起編輯 ✈️'))
      .catch(()=>{ prompt('複製以下連結分享給旅伴：', url); });
  }
}

        pendingRemoteUpdate = false; setTimeout(render, 50);
      }
    }, true);

      const el = document.getElementById('sync-status');
      if(!el) return;

        el.innerHTML='<i class="ti ti-cloud-check"></i> 已連線'; el.style.color='#0F6E56';
        // 登記自己在線，斷線時自動移除
        const presRef = firebase.database().ref('presence/' + CLIENT_ID);
        presRef.set({ ts: Date.now() });
        presRef.onDisconnect().remove();
      } else {
        el.innerHTML='<i class="ti ti-cloud-off"></i> 離線'; el.style.color='#999';
      }
    });

    // 監聽在線人數
    firebase.database().ref('presence').on('value', snap => {
      const bar   = document.getElementById('online-bar');
      const dots  = document.getElementById('online-dots');
      const text  = document.getElementById('online-text');
      if(!bar || !dots || !text) return;
